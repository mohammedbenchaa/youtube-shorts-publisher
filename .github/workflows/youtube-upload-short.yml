name: Upload reviewed YouTube video

on:
  workflow_dispatch:
    inputs:
      transfer_tag:
        description: 'Authenticated draft release containing reviewed media'
        required: true
        type: string
      mode:
        description: 'Verify channel, upload once, or verify the existing upload'
        type: choice
        options: [preflight, upload, verify]
        default: preflight

permissions:
  contents: write

concurrency:
  group: reviewed-youtube-${{ inputs.transfer_tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRANSFER_TAG: ${{ inputs.transfer_tag }}
      UPLOAD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download authenticated draft-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[A-Za-z0-9._-]+",os.environ["TRANSFER_TAG"])'
          test "$(gh release view "$TRANSFER_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$TRANSFER_TAG" --repo "$GITHUB_REPOSITORY" --dir transfer
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('transfer');manifest=json.loads((root/'transfer-manifest.json').read_text())
          for name,record in manifest['assets'].items():
              path=root/name
              assert path.stat().st_size==record['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256'],name
          print('Reviewed transfer hashes verified')
          PY
      - name: Verify channel and run authorized operation
        env:
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "$UPLOAD_MODE" = preflight ]; then
            python .github/scripts/upload_reviewed.py transfer preflight
          elif [ "$UPLOAD_MODE" = upload ]; then
            if [ ! -f transfer/youtube.json ]; then
              python .github/scripts/upload_reviewed.py transfer preflight
              python .github/scripts/upload_reviewed.py transfer upload
            fi
            python .github/scripts/upload_reviewed.py transfer thumbnail
            python .github/scripts/upload_reviewed.py transfer status
          else
            python .github/scripts/upload_reviewed.py transfer status
          fi
      - name: Preserve private upload receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          receipts=(transfer/youtube*.json transfer/thumbnail-upload.json)
          if [ "${#receipts[@]}" -gt 0 ]; then
            gh release upload "$TRANSFER_TAG" "${receipts[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
      - name: Upload summary
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          path=Path('transfer/youtube.json')
          if path.exists():
              result=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('Reviewed YouTube video: '+result['url']+'\n')
          PY
